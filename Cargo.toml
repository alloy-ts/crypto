[package]
name = "lib-crypto-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2-rust = "1.1.0"
base64 = "0.22.1"
boring-rustls-provider = "5.0.1"
hex = "0.4.3"
napi = "3"
napi-derive = "3"
rand = "0.10.3"
ring = "0.17.14"
rustls = { version = "0.23.45", features = ["ring"] }
rustls-mbedcrypto-provider = "0.1.1"
rustls-openssl = "0.4.2"
simdutf8 = "0.1.5"

[build-dependencies]
napi-build = "2"
