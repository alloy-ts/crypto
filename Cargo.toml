[package]
name = "lib-crypto-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["tls-native"]
# Native crypto backends (OpenSSL / BoringSSL / mbedTLS) cannot be cross-compiled
# to wasm32-wasip1-threads. Disable via --no-default-features for the wasm target.
tls-native = ["dep:boring-rustls-provider", "dep:rustls-mbedcrypto-provider", "dep:rustls-openssl"]

[dependencies]
argon2-rust = "1.1.0"
base64 = "0.22.1"
boring-rustls-provider = { version = "5.0.1", optional = true }
hex = "0.4.3"
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
num-traits = "0.2"
rand = "0.10.3"
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["sha2"] }
# default-features = false drops the aws-lc-rs backend, which is a C/asm library
# that does not build for wasm32-wasip1-threads.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-mbedcrypto-provider = { version = "0.1.1", optional = true }
rustls-openssl = { version = "0.4.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10.8"
simdutf8 = "0.1.5"
x509-parser = "0.18.1"

[build-dependencies]
napi-build = "2"
