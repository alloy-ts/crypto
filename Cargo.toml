[package]
name = "lib-crypto-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2-rust = "1.1.0"
base64 = "0.22.1"
hex = "0.4.3"
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
num-traits = "0.2"
rand = "0.10.3"
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10.8"
simdutf8 = "0.1.5"
x509-parser = "0.18.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
boring-rustls-provider = "5.0.1"
rustls-mbedcrypto-provider = "0.1.1"
rustls-openssl = "0.4.2"

[build-dependencies]
napi-build = "2"
